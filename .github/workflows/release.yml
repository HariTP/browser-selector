name: Build release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: linux-x86_64
          - os: windows-latest
            asset: windows-x86_64
          - os: macos-15-intel
            asset: macos-x86_64
          - os: macos-15
            asset: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils xdg-utils libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
      - name: Install build dependencies
        run: python -m pip install . "pyinstaller>=6.10,<7"
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python -c 'import os,tomllib; version=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+version'
      - name: Run automated tests
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -v
      - name: Build native packages and check bundled app
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Browser Selector $GITHUB_REF_NAME" --notes-file packaging/release-notes.md --prerelease --verify-tag
